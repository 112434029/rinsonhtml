<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 450px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            text-align: center;
            color: darkblue;
        }

        label {
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .radio-group input {
            width: auto;
            margin-right: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Registration Form</h2>

    <form>

        <label>Name:</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Age:</label>
        <input type="number" placeholder="Enter your age" required>

        <label>Date:</label>
        <input type="date">

        <label>Day:</label>
        <input type="text" placeholder="Enter day (e.g., Monday)">

        <label>Time:</label>
        <input type="time">

        <label>Email:</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Course:</label>
        <select>
            <option>Select Course</option>
            <option>HTML</option>
            <option>CSS</option>
            <option>JavaScript</option>
            <option>Python</option>
        </select>

        <label>Gender:</label>
        <div class="radio-group">
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <input type="radio" name="gender"> Other
        </div>

        <br><br>

        <label>Address:</label>
        <textarea rows="4" placeholder="Enter your address"></textarea>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</div>

</body>
</html>
